{% extends "base.html" %}
{% block title %}Giriş Yap{% endblock %}

{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 mt-5">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-sign-in-alt fa-3x text-primary mb-3"></i>
                    <h2 class="fw-bold">Hoş Geldin</h2>
                    <p class="text-muted">Gelişimini takip etmek için giriş yap.</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Kullanıcı Adı</label>
                        <input type="text" class="form-control form-control-lg bg-light border-0" placeholder="Kullanıcı adın" name="username">
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label class="form-label small fw-bold">Şifre</label>
                        </div>
                        <input type="password" class="form-control form-control-lg bg-light border-0" placeholder="••••••••" name="password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Giriş Yap</button>
                </form>
                
                <hr class="my-4">
                <div class="text-center small">
                    Hesabın yok mu? <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Hemen Kayıt Ol</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
