{% extends "base.html" %}

{% block title %}Kayıt Ol{% endblock %}

{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 mt-5">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                    <h2 class="fw-bold">Hesap Oluştur</h2>
                    <p class="text-muted">Gelişimini takip etmek için hesap oluştur.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Kullanıcı Adı</label>
                        <input type="text" class="form-control form-control-lg bg-light border-0" placeholder="Kullanıcı adın" name="username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">E-posta</label>
                        <input type="email" class="form-control form-control-lg bg-light border-0" placeholder="E-posta adresin" name="email">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Şifre</label>
                        <input type="password" class="form-control form-control-lg bg-light border-0" placeholder="••••••••" name="password">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Tekrar Şifre</label>
                        <input type="password" class="form-control form-control-lg bg-light border-0" placeholder="••••••••" name="repassword">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Kayıt Ol</button>
                </form>

                <hr class="my-4">
                <div class="text-center small">
                    Hesabın var mı? <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Giriş Yap</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
