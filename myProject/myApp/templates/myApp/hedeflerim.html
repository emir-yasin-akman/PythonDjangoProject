{% extends 'base.html' %}
{% block title %}Hedeflerim{% endblock %}

{% block content %}

    {% if user.is_authenticated %}
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-4"><i class="fas fa-edit text-primary me-2"></i>Bugünkü İlerleyişin</h3>
                        
                        <form method="POST" action="{% url 'not_ekle' %}">
                            {% csrf_token %}
                            
                            <!-- Hedef Seçimi (Dinamik gelecek) -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Hangi hedefinle ilgili not yazıyorsun?</label>
                                <select name="secilen_hedef_id" class="form-select form-select-lg" required>
                                 <option value="" disabled selected>Seçiniz...</option>
                                    {% for s_hedef in secilen_hedefler %}
                                        <option value="{{ s_hedef.id }}">{{ s_hedef.hedef.baslik }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Not Giriş Alanı -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Neler yaptın? Nasıl hissediyorsun?</label>
                                <textarea name="not_metni" class="form-control" rows="5" placeholder="Bugün 2 saat çalıştım, biraz yorucu ama verimliydi..." required></textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg shadow-sm">
                                    <i class="fas fa-save me-2"></i>Notu Kaydet ve AI Analizi Al
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    {% else %}
        <div class="alert alert-info text-center" role="alert">
            Hedeflerinizi görmek için lütfen <a href="{% url 'login' %}" class="alert-link">giriş yapın</a> veya <a href="{% url 'register' %}" class="alert-link">kayıt olun</a>.
        </div>
    {% endif %}

{% endblock %}
